<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HYPERSENSEINDIA • Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{--bg:#070b12;--bg2:#0d1420;--card:#111a29;--line:#1c2839;--txt:#e6f1ff;
    --dim:#7c8da3;--acc:#00e5a0;--acc2:#00b377;--danger:#ff4d6d;--warn:#ffb020;
    --dc:#5865F2;--res:#8a9bff}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100vh}
  .hidden{display:none!important}

  #loginView{display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:radial-gradient(circle at 50% 0%,#0d2a25 0%,#070b12 60%)}
  .loginBox{width:400px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:38px 32px;box-shadow:0 20px 60px rgba(0,229,160,.08)}
  .logo{width:70px;height:70px;border-radius:50%;
    background:conic-gradient(from 180deg,#00e5a0,#00b377,#0d2a25,#00e5a0);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
    font-weight:800;color:#001a12;font-size:22px}
  h1{font-size:22px;text-align:center;letter-spacing:2px}
  .sub{text-align:center;color:var(--acc);font-size:11px;letter-spacing:3px;margin-bottom:26px}

  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px;letter-spacing:1px}
  input,select,textarea{width:100%;padding:11px 14px;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;
    outline:none;transition:.2s;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  textarea{resize:vertical;min-height:70px}
  button{cursor:pointer;border:none;border-radius:10px;font-weight:600;transition:.2s}
  .btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    color:#001a12;font-size:14px;margin-top:22px;letter-spacing:1px}
  .btn:hover{filter:brightness(1.1)}
  .err{color:var(--danger);font-size:12px;text-align:center;margin-top:12px;min-height:16px}
  .ok{color:var(--acc);font-size:12px;text-align:center;margin-top:12px;min-height:16px}

  #dash{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  .side{background:var(--bg2);border-right:1px solid var(--line);padding:22px 16px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .brand .dot{width:34px;height:34px;border-radius:50%;
    background:conic-gradient(from 180deg,#00e5a0,#00b377,#0d2a25,#00e5a0);
    display:flex;align-items:center;justify-content:center;font-size:11px;
    font-weight:800;color:#001a12}
  .brand b{font-size:13px;letter-spacing:1px}
  .brand span{display:block;font-size:9px;color:var(--acc);letter-spacing:2px}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav a{padding:11px 14px;border-radius:10px;color:var(--dim);text-decoration:none;
    font-size:13px;transition:.2s;cursor:pointer}
  .nav a:hover{background:var(--card);color:var(--txt)}
  .nav a.active{background:linear-gradient(135deg,rgba(0,229,160,.18),rgba(0,179,119,.08));
    color:var(--acc);border-left:3px solid var(--acc)}
  .nav .section{font-size:9px;color:var(--dim);letter-spacing:2px;margin:14px 8px 4px}

  .main{padding:26px 30px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .topbar h2{font-size:20px;letter-spacing:1px}
  .topbar .who{font-size:12px;color:var(--dim)}
  .topbar .who b{color:var(--acc)}
  .topbar .role{font-size:9px;padding:3px 8px;border-radius:20px;margin-left:8px;
    background:rgba(0,229,160,.18);color:var(--acc);letter-spacing:1px}
  .logout{padding:8px 14px;background:var(--danger);color:#fff;font-size:11px;
    border-radius:8px;margin-left:14px}
  .refresh{padding:8px 14px;background:var(--bg2);color:var(--acc);font-size:11px;
    border-radius:8px;margin-left:14px;border:1px solid var(--line);letter-spacing:1px}
  .refresh:hover{background:var(--card);border-color:var(--acc)}
  .refresh.spinning{animation:spin .6s linear}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card h3{font-size:12px;color:var(--dim);letter-spacing:2px;margin-bottom:12px}
  .kpi{font-size:28px;font-weight:700;color:var(--acc)}
  .kpi.danger{color:var(--danger)} .kpi.warn{color:var(--warn)}
  .kpi.dc{color:var(--dc)} .kpi.res{color:var(--res)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px;margin-top:22px}
  .panel h3{font-size:13px;letter-spacing:2px;color:var(--acc);margin-bottom:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:1px;text-align:left;
    padding:10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid #16202e;vertical-align:top}
  tr:hover td{background:#0f1727}
  .badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.5px}
  .on{background:rgba(0,229,160,.15);color:var(--acc)}
  .off{background:rgba(255,77,109,.15);color:var(--danger)}
  .exp{background:rgba(255,176,32,.15);color:var(--warn)}
  .dcb{background:rgba(88,101,242,.18);color:#8a9bff}
  .resb{background:rgba(138,155,255,.18);color:var(--res)}

  .mini{padding:6px 11px;font-size:11px;border-radius:8px;margin-right:5px;margin-bottom:4px}
  .mini.d{background:var(--danger);color:#fff}
  .mini.e{background:var(--acc);color:#001a12}
  .mini.b{background:var(--line);color:var(--txt)}
  .mini.r{background:var(--res);color:#0a0f1c}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--card);
    border:1px solid var(--acc);color:var(--txt);padding:14px 20px;border-radius:12px;
    font-size:13px;box-shadow:0 10px 40px rgba(0,229,160,.2);z-index:99;
    opacity:0;transform:translateY(20px);transition:.3s;max-width:400px}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{border-color:var(--danger);box-shadow:0 10px 40px rgba(255,77,109,.2)}

  .sw{width:52px;height:28px;border-radius:20px;background:#2a3444;position:relative;
    cursor:pointer;transition:.25s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
    border-radius:50%;background:#fff;transition:.25s}
  .sw.on{background:var(--acc)} .sw.on::after{left:27px}
  .swrow{display:flex;align-items:center;gap:14px}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;
    align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:26px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto}
  .modal h3{color:var(--acc);margin-bottom:14px;font-size:15px;letter-spacing:1px}

  .keychip{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    background:#0a1420;border:1px solid var(--line);padding:5px 10px;border-radius:8px;
    color:var(--acc);cursor:pointer;margin:3px 4px 3px 0}
  .keychip:hover{border-color:var(--acc)}
  .searchbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .searchbar input{flex:1;min-width:200px}
  .note{background:#0f1727;border-left:3px solid var(--warn);padding:8px 12px;
    border-radius:6px;font-size:12px;color:var(--dim);margin-top:10px}
  .empty{text-align:center;color:var(--dim);padding:24px;font-size:13px}
</style>
</head>
<body>

<div id="loginView">
  <div class="loginBox">
    <div class="logo">HS</div>
    <h1>HYPERSENSEINDIA</h1>
    <div class="sub">ADMIN • CONTROL</div>
    <label>EMAIL</label>
    <input id="lgEmail" type="email" value="aswinpfi@gmail.com" readonly />
    <label>PASSWORD</label>
    <input id="lgPass" type="password" placeholder="••••••••" />
    <button class="btn" id="lgBtn">AUTHENTICATE</button>
    <div class="err" id="lgErr"></div>
    <div class="ok" id="lgOk"></div>
  </div>
</div>

<div id="dash" class="hidden">
  <aside class="side">
    <div class="brand">
      <div class="dot">HS</div>
      <div><b>HYPERSENSEINDIA</b><span>ADMIN</span></div>
    </div>
    <nav class="nav" id="navRoot"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">Overview</h2>
      <div style="display:flex;align-items:center">
        <div class="who">Logged as <b id="whoEmail">—</b>
          <span class="role">ADMIN</span></div>
        <button class="refresh" id="refreshBtn">⟳ REFRESH</button>
        <button class="logout" id="logoutBtn">LOGOUT</button>
      </div>
    </div>
    <div id="tabContent"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set as rset, get as rget, update as rupdate,
         remove as rremove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFf_skp9nhvdWHyJy_ICGdW8r01EmGlss",
  authDomain: "hypersenseauth.firebaseapp.com",
  projectId: "hypersenseauth",
  databaseURL: "https://hypersenseauth-default-rtdb.firebaseio.com/",
  storageBucket: "hypersenseauth.firebasestorage.app",
  messagingSenderId: "638076403379",
  appId: "1:638076403379:web:90de28063ab1c19c6fbac6"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const rtdb = getDatabase(app);

const SUPER_ADMIN_EMAIL = "aswinpfi@gmail.com";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer=null;
function toast(msg, isErr=false){
  const t=$("toast"); t.textContent=msg;
  t.className="toast show"+(isErr?" err":"");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.className="toast",3500);
}
function genKey(){
  const C="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const s=n=>Array.from({length:n},()=>C[Math.floor(Math.random()*C.length)]).join("");
  return `HS-${s(4)}-${s(4)}-${s(4)}`;
}
async function safeGet(p){
  try{ const s=await rget(ref(rtdb,p)); return s.exists()?s.val():{}; }
  catch{ return {}; }
}
async function ensureAuth(email, pass){
  let r=await fetch(
    `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`,
    {method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({email,password:pass,returnSecureToken:false})});
  let data=await r.json();
  if(!data.error) return data.localId;
  if(data.error.message==="EMAIL_EXISTS"){
    const r2=await fetch(
      `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${firebaseConfig.apiKey}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({email,password:pass,returnSecureToken:false})});
    const d2=await r2.json();
    if(d2.error) throw new Error("Account exists but password differs.");
    return d2.localId;
  }
  throw new Error(data.error.message);
}

let SESSION=null;
let CURRENT_TAB="overview";
let AUTO_REFRESH_TIMER=null;
const AUTO_REFRESH_MS = 300000; // 30 seconds

/* ===== LOGIN ===== */
$("lgBtn").onclick = async () => {
  $("lgErr").textContent=""; $("lgOk").textContent="";
  const email=$("lgEmail").value.trim().toLowerCase();
  const pass =$("lgPass").value;
  if(!email||!pass) return $("lgErr").textContent="Fill both fields.";
  if(email !== SUPER_ADMIN_EMAIL){
    $("lgErr").textContent="Only the super admin can log in here.";
    return;
  }
  $("lgBtn").textContent="AUTHENTICATING…";
  try{
    const cred=await signInWithEmailAndPassword(auth,email,pass);
    const uid=cred.user.uid;
    SESSION={uid,email,isSuper:true};
    try{
      const snap=await rget(ref(rtdb,`users/${uid}`));
      const u=snap.exists()?snap.val():{};
      if(u.admin!==true || u.email!==email){
        await rupdate(ref(rtdb,`users/${uid}`),{
          email, admin:true, lifetime:true, created_at:u.created_at||Date.now()
        });
      }
    }catch(e){ console.warn(e); }
    $("loginView").classList.add("hidden");
    $("dash").classList.remove("hidden");
    $("whoEmail").textContent=email;
    buildNav(); goto("overview");
    startAutoRefresh();
  }catch(e){
    $("lgErr").textContent=(e.code||e.message||"").replace("auth/","");
    $("lgBtn").textContent="AUTHENTICATE";
  }
};
$("lgPass").addEventListener("keydown",e=>e.key==="Enter"&&$("lgBtn").click());

$("logoutBtn").onclick = async () => {
  stopAutoRefresh();
  await signOut(auth);
  location.reload();
};

/* Manual refresh button */
$("refreshBtn").onclick = () => {
  const btn=$("refreshBtn");
  btn.classList.add("spinning");
  setTimeout(()=>btn.classList.remove("spinning"),600);
  RENDER[CURRENT_TAB] && RENDER[CURRENT_TAB]();
  toast("Refreshed.");
};

/* ===== AUTO-REFRESH ===== */
function startAutoRefresh(){
  stopAutoRefresh();
  AUTO_REFRESH_TIMER = setInterval(()=>{
    if(document.hidden) return;             // pause when tab is not visible
    if(!SESSION) return;                    // only when logged in
    RENDER[CURRENT_TAB] && RENDER[CURRENT_TAB]();
  }, AUTO_REFRESH_MS);
}
function stopAutoRefresh(){
  if(AUTO_REFRESH_TIMER){ clearInterval(AUTO_REFRESH_TIMER); AUTO_REFRESH_TIMER=null; }
}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && SESSION){
    RENDER[CURRENT_TAB] && RENDER[CURRENT_TAB]();
  }
});

/* ===== NAV ===== */
const NAV = [
  { section:"MAIN" },
  { id:"overview",  label:"◈ Overview" },
  { section:"USERS" },
  { id:"users",     label:"◈ All Users" },
  { id:"create",    label:"◈ Create User" },
  { section:"RESELLERS" },
  { id:"resellers", label:"◈ Resellers" },
  { id:"r_create",  label:"◈ Add Reseller" },
  { section:"SYSTEM" },
  { id:"appctrl",   label:"◈ App Control" },
  { id:"hwid",      label:"◈ HWID Locks" },
  { id:"verify",    label:"◈ Discord Verify" },
  { id:"msgs",      label:"◈ Support Inbox" }
];
function buildNav(){
  const root=$("navRoot"); root.innerHTML="";
  NAV.forEach(it=>{
    if(it.section){
      const s=document.createElement("div");
      s.className="section"; s.textContent=it.section; root.appendChild(s);
    } else {
      const a=document.createElement("a");
      a.dataset.tab=it.id; a.textContent=it.label;
      a.onclick=()=>goto(it.id); root.appendChild(a);
    }
  });
}
function goto(id){
  CURRENT_TAB=id;
  document.querySelectorAll(".nav a").forEach(x=>
    x.classList.toggle("active", x.dataset.tab===id));
  $("pageTitle").textContent =
    document.querySelector(`.nav a[data-tab="${id}"]`)?.textContent
      .replace("◈","").trim() || id;
  $("tabContent").innerHTML=`<div class="panel"><h3>LOADING…</h3></div>`;
  (RENDER[id] || (()=> $("tabContent").innerHTML=
    `<div class="panel"><h3>NOT FOUND</h3></div>`))();
}

/* ===== RENDER ===== */
const RENDER = {};

/* ---------- OVERVIEW ---------- */
RENDER.overview = async () => {
  const [users,resellers,keys,config] = await Promise.all([
    safeGet("users"), safeGet("resellers"), safeGet("keys"), safeGet("config")
  ]);
  let active=0, expired=0, hwid=0, dc=0;
  for(const u of Object.values(users)){
    const isLife=u.lifetime===true;
    const isExp=u.expires_at && !isLife && new Date(u.expires_at)<new Date();
    if(isLife||!isExp) active++; else expired++;
    if(u.hwid) hwid++;
    if(u.discord_id) dc++;
  }
  const used = Object.values(keys).filter(k=>k.used).length;
  const unused = Object.keys(keys).length - used;
  $("tabContent").innerHTML=`
    <div class="grid">
      <div class="card"><h3>TOTAL USERS</h3><div class="kpi">${Object.keys(users).length}</div></div>
      <div class="card"><h3>ACTIVE</h3><div class="kpi">${active}</div></div>
      <div class="card"><h3>EXPIRED</h3><div class="kpi danger">${expired}</div></div>
      <div class="card"><h3>HWID LOCKED</h3><div class="kpi warn">${hwid}</div></div>
      <div class="card"><h3>DISCORD LINKED</h3><div class="kpi dc">${dc}</div></div>
      <div class="card"><h3>RESELLERS</h3><div class="kpi res">${Object.keys(resellers).length}</div></div>
      <div class="card"><h3>KEYS USED</h3><div class="kpi">${used}</div></div>
      <div class="card"><h3>KEYS AVAILABLE</h3><div class="kpi warn">${unused}</div></div>
    </div>
    <div class="panel">
      <h3>SYSTEM</h3>
      <div class="row">
        <div><label>RAR NAME</label><input readonly value="${esc(config.rar_name||'DataInput.rar')}"></div>
        <div><label>LOGIN GATE</label><input readonly value="${config.login_enabled===false?'DISABLED':'ENABLED'}"></div>
      </div>
      <div class="note">Auto-refresh every 30s. Last update: ${new Date().toLocaleTimeString()}</div>
    </div>`;
};

/* ---------- ALL USERS (grouped by owner) ---------- */
RENDER.users = async () => {
  $("tabContent").innerHTML=`
    <div class="panel">
      <h3>ALL USERS</h3>
      <div class="searchbar">
        <input id="uSearch" placeholder="Search email / uid / discord / hwid / note…"/>
        <select id="uOwner" style="max-width:240px">
          <option value="all">All owners</option>
          <option value="__admin__">Admin-owned</option>
        </select>
        <select id="uFilter" style="max-width:200px">
          <option value="all">All status</option>
          <option value="active">Active</option>
          <option value="expired">Expired</option>
          <option value="lifetime">Lifetime</option>
        </select>
      </div>
      <div id="uGroupInfo" style="font-size:12px;color:var(--dim);margin-bottom:8px"></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>EMAIL</th><th>UID</th><th>OWNER</th><th>EXPIRES</th>
            <th>HWID</th><th>DISCORD</th><th>NOTE</th><th>STATUS</th><th>ACTIONS</th>
          </tr></thead>
          <tbody id="uBody"></tbody>
        </table>
      </div>
    </div>`;

  const users=await safeGet("users");
  const resellers=await safeGet("resellers");
  const rows=Object.entries(users).map(([uid,u])=>({uid,...u}));

  const ownerSel=$("uOwner");
  Object.entries(resellers)
    .sort((a,b)=>String(a[0]).localeCompare(String(b[0])))
    .forEach(([rid,r])=>{
      const o=document.createElement("option");
      o.value=rid;
      const count=rows.filter(x=>x.reseller_id===rid).length;
      o.textContent=`${r.name||r.email||rid} (${rid}) — ${count}`;
      ownerSel.appendChild(o);
    });

  function render(){
    const q=($("uSearch").value||"").toLowerCase();
    const owner=$("uOwner").value;
    const f=$("uFilter").value;
    const tb=$("uBody"); tb.innerHTML="";
    const filtered = rows.filter(u=>{
      const isLife=u.lifetime===true;
      const isExp=u.expires_at && !isLife && new Date(u.expires_at)<new Date();
      if(f==="active" && isExp) return false;
      if(f==="expired" && !isExp) return false;
      if(f==="lifetime" && !isLife) return false;
      if(owner==="__admin__"){
        if(u.reseller_id) return false;
      } else if(owner!=="all"){
        if(u.reseller_id!==owner) return false;
      }
      if(!q) return true;
      const blob=[u.email,u.uid,u.discord_id,u.hwid,u.note,u.reseller_id,u.phone]
        .filter(Boolean).join(" ").toLowerCase();
      return blob.includes(q);
    });

    if(owner==="all"){
      $("uGroupInfo").textContent = `${filtered.length} users total`;
    } else if(owner==="__admin__"){
      $("uGroupInfo").textContent = `Admin-owned: ${filtered.length} users`;
    } else {
      const r=resellers[owner]||{};
      $("uGroupInfo").textContent = `Reseller: ${r.name||r.email||owner} (${owner}) — ${filtered.length} users`;
    }

    if(!filtered.length){
      tb.innerHTML=`<tr><td colspan="9" class="empty">No users found.</td></tr>`;
      return;
    }

    filtered.forEach(u=>{
      const isLife=u.lifetime===true;
      const exp=u.expires_at?new Date(u.expires_at):null;
      const isExp=exp && !isLife && exp<new Date();
      const isSuper=(u.email||"").toLowerCase()===SUPER_ADMIN_EMAIL;
      const ownerLabel=u.reseller_id
        ? ((resellers[u.reseller_id]?.name||u.reseller_id) + " (" + u.reseller_id + ")")
        : (u.admin===true ? "ADMIN" : "—");
      const tr=document.createElement("tr");
      tr.innerHTML=`

          ${u.note?esc(u.note):'<span style="color:var(--dim)">—</span>'}

        </td>`;
      tb.appendChild(tr);
    });
    tb.querySelectorAll("[data-a]").forEach(b=>{
      b.onclick=()=>userAction(b.dataset.a,b.dataset.uid);
    });
  }
  $("uSearch").addEventListener("input",render);
  $("uOwner").addEventListener("change",render);
  $("uFilter").addEventListener("change",render);
  render();

  async function userAction(act,uid){
    const u=rows.find(x=>x.uid===uid);
    const isSuper=(u?.email||"").toLowerCase()===SUPER_ADMIN_EMAIL;
    if(isSuper && (act==="del"||act==="life"||act==="reset"||act==="edit"))
      return toast("Cannot modify the super admin.",true);
    try{
      if(act==="edit"){
        return openUserEditModal(uid,u);
      } else if(act==="note"){
        const v=prompt("Note for this user:",u?.note||"");
        if(v===null) return;
        await rupdate(ref(rtdb,`users/${uid}`),{note:v.trim()||null});
        toast("Note updated.");
      } else if(act==="life"){
        await rupdate(ref(rtdb,`users/${uid}`),{lifetime:true,expires_at:null});
        toast("Lifetime granted.");
      } else if(act==="reset"){
        await rupdate(ref(rtdb,`users/${uid}`),{hwid:null,last_seen:null});
        toast("HWID reset.");
      } else if(act==="del"){
        if(!confirm("Delete this user record? (Auth account remains)")) return;
        await rremove(ref(rtdb,`users/${uid}`));
        toast("Removed.");

/* ---------- VERIFY ---------- */
RENDER.verify = async () => {
  $("tabContent").innerHTML=`
    <div class="panel">
      <h3>DISCORD VERIFICATION QUEUE</h3>
      <p style="font-size:12px;color:var(--dim);margin-bottom:12px">
        Entries submitted from the tool appear here. Approve to unlock the RAR.</p>
      <div id="vInfo" style="font-size:12px;color:var(--dim);margin-bottom:8px"></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>WHEN</th><th>EMAIL</th><th>DISCORD</th><th>PHONE</th>
            <th>STATUS</th><th>ACTIONS</th></tr></thead>
          <tbody id="vBody"></tbody>
        </table>
      </div>
      <div class="note">
        If nothing shows up here, the tool must write to <b>verify_queue/&lt;key&gt;</b>
        with fields <b>ts, uid, email, discord_id, phone</b>. Check DevTools of the
        tool to confirm the write succeeded.
      </div>
    </div>`;

  const q = await safeGet("verify_queue");
  const entries = Object.entries(q).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));

  $("vInfo").textContent = `${entries.length} entries — pending: `+
    entries.filter(([,v])=>!v.status||v.status==="pending").length;

  const tb=$("vBody");
  if(!entries.length){
    tb.innerHTML=`<tr><td colspan="6" class="empty">Queue is empty.</td></tr>`;
    return;
  }
  entries.forEach(([k,v])=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td style="font-size:11px">${v.ts?new Date(v.ts).toLocaleString():"—"}</td>
      <td>${esc(v.email||"—")}</td>
      <td style="color:#8a9bff"><b>${esc(v.discord_id||"—")}</b></td>
      <td>${esc(v.phone||"—")}</td>
      <td>${v.status==="approved"?'<span class="badge on">APPROVED</span>':
            v.status==="rejected"?'<span class="badge off">REJECTED</span>':
            '<span class="badge exp">PENDING</span>'}</td>
      <td>
        <button class="mini e" data-a="ap" data-k="${k}" data-uid="${v.uid||""}">APPROVE</button>
        <button class="mini d" data-a="rj" data-k="${k}">REJECT</button>
        <button class="mini b" data-a="cl" data-k="${k}">CLEAR</button>
      </td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll("[data-a]").forEach(b=>{
    b.onclick=async()=>{
      const k=b.dataset.k, a=b.dataset.a;
      try{
        if(a==="cl"){ await rremove(ref(rtdb,`verify_queue/${k}`)); toast("Cleared."); }
        else if(a==="rj"){ await rupdate(ref(rtdb,`verify_queue/${k}`),{status:"rejected"}); toast("Rejected."); }
        else if(a==="ap"){
          const cur=q[k];
          if(b.dataset.uid){
            await rupdate(ref(rtdb,`users/${b.dataset.uid}`),{
              discord_id: cur.discord_id||null,
              phone: cur.phone||null,
              discord_verified: true,
              verified_at: Date.now()
            });
          }
          await rupdate(ref(rtdb,`verify_queue/${k}`),{status:"approved"});
          toast("Approved.");
        }
        RENDER.verify();
      }catch(e){ toast(e.message,true); }
    };
  });
};

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td style="font-size:11px">${new Date(m.ts||Date.now()).toLocaleString()}</td>
      <td>${esc(m.email||"anon")}</td>
      <td style="max-width:400px">${esc(m.text||"")}</td>
      <td><button class="mini d" data-k="${k}">CLEAR</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll("[data-k]").forEach(b=>{
    b.onclick=async()=>{
      await rremove(ref(rtdb,"messages/"+b.dataset.k));
      RENDER.msgs();
    };
  });
};
</script>
</body>
</html>
